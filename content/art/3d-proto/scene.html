<script type="module">
import * as THREE from 'three';

const params = new URLSearchParams(location.search);
const MODE = params.get('mode') || 'city';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });

const scene = new THREE.Scene();

// ---------- camera: isometric-ish ----------
const aspect = W / H;

camera.lookAt(MODE === 'sheet' ? 0 : 0.8, 0.6, MODE === 'sheet' ? 0 : -1.8);

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xe8f6ff, 0xa9d67f, MODE === 'sheet' ? 0.7 : 1.0));
const sun = new THREE.DirectionalLight(0xfff4e0, MODE === 'sheet' ? 1.7 : 1.85);
sun.position.set(-18, 30, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
const s = 30; sun.shadow.camera.left = -s; sun.shadow.camera.right = s; sun.shadow.camera.top = s; sun.shadow.camera.bottom = -s;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 90; sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02; sun.shadow.radius = 4;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xcfe8ff, 0.45); fill.position.set(20, 12, -18); scene.add(fill);

// ---------- helpers ----------
const mat = (c, opts = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: opts.roughness ?? 0.85, metalness: 0, ...opts });
const glassMat = (tint = 0x7fd0f0) => new THREE.MeshStandardMaterial({ color: tint, roughness: 0.12, metalness: 0.35, emissive: 0x2a6f9a, emissiveIntensity: 0.35 });
function box(w, h, d, m, r = 0.06) {
  const g = new RoundedBoxGeometry(w, h, d, 3, r);
  const mesh = new THREE.Mesh(g, m); mesh.castShadow = true; mesh.receiveShadow = true; return mesh;
}
function add(parent, mesh, x, y, z) { mesh.position.set(x, y, z); parent.add(mesh); return mesh; }

// ---------- building factory ----------
function building(o) {
  const g = new THREE.Group();
  const { w = 3, d = 3, floors = 2, fh = 1.15, wall, trim = 0xfff4d8, roof, roofType = 'flat', glass = 0x7fd0f0, band = true, awning, sign, dome, tower } = o;
  const H = floors * fh;
  // plinth
  add(g, box(w + 0.35, 0.18, d + 0.35, mat(0xe9e2cf), 0.05), 0, 0.09, 0);
  // body
  add(g, box(w, H, d, mat(wall), 0.08), 0, 0.18 + H / 2, 0);
  // floor bands + windows
  for (let f = 0; f < floors; f++) {
    const y0 = 0.18 + f * fh;
    if (band && f > 0) add(g, box(w + 0.12, 0.1, d + 0.12, mat(trim), 0.03), 0, y0, 0);
    const nx = Math.max(1, Math.round(w / 1.05)), nz = Math.max(1, Math.round(d / 1.05));
    for (let i = 0; i < nx; i++) {
      const x = -w / 2 + (i + 0.5) * (w / nx);
      const win = box(0.62, 0.66, 0.08, glassMat(glass), 0.02); add(g, win, x, y0 + fh * 0.55, d / 2 + 0.03);
      const fr = box(0.74, 0.78, 0.05, mat(trim), 0.02); add(g, fr, x, y0 + fh * 0.55, d / 2 + 0.005);
      const win2 = box(0.62, 0.66, 0.08, glassMat(glass), 0.02); add(g, win2, x, y0 + fh * 0.55, -d / 2 - 0.03);
    }
    for (let i = 0; i < nz; i++) {
      const z = -d / 2 + (i + 0.5) * (d / nz);
      const win = box(0.08, 0.66, 0.62, glassMat(glass), 0.02); add(g, win, w / 2 + 0.03, y0 + fh * 0.55, z);
      const fr = box(0.05, 0.78, 0.74, mat(trim), 0.02); add(g, fr, w / 2 + 0.005, y0 + fh * 0.55, z);
    }
  }
  // door (front = +z)
  const door = box(0.7, 0.95, 0.1, mat(o.door ?? 0x8b5a3c), 0.03); add(g, door, w / 2 - 0.8, 0.18 + 0.48, d / 2 + 0.04);
  if (awning) { const a = box(1.1, 0.08, 0.6, mat(awning), 0.03); add(g, a, w / 2 - 0.8, 0.18 + 1.05, d / 2 + 0.3); }
  // roof
  const top = 0.18 + H;
  if (roofType === 'flat') {
    add(g, box(w + 0.2, 0.16, d + 0.2, mat(trim), 0.04), 0, top + 0.08, 0);
    add(g, box(w - 0.5, 0.08, d - 0.5, mat(roof), 0.03), 0, top + 0.2, 0);
    if (o.ac) add(g, box(0.5, 0.35, 0.5, mat(0xd6d6d6), 0.04), -w / 2 + 0.6, top + 0.38, -d / 2 + 0.6);
  } else if (roofType === 'hip') {
    const hh = Math.min(w, d) * 0.42;
    const geo = new THREE.ConeGeometry(Math.max(w, d) * 0.78, hh, 4, 1);
    const m = new THREE.Mesh(geo, mat(roof, { roughness: 0.7 })); m.rotation.y = Math.PI / 4; m.scale.set(w / Math.max(w, d), 1, d / Math.max(w, d)); m.castShadow = true; m.receiveShadow = true;
    add(g, m, 0, top + hh / 2 - 0.02, 0);
    add(g, box(w + 0.25, 0.1, d + 0.25, mat(trim), 0.03), 0, top + 0.03, 0);
  } else if (roofType === 'gable') {
    const hh = d * 0.38;
    const shape = new THREE.Shape(); shape.moveTo(-d / 2 - 0.25, 0); shape.lineTo(d / 2 + 0.25, 0); shape.lineTo(0, hh); shape.closePath();
    const geo = new THREE.ExtrudeGeometry(shape, { depth: w + 0.4, bevelEnabled: false });
    const m = new THREE.Mesh(geo, mat(roof, { roughness: 0.7 })); m.rotation.y = Math.PI / 2; m.castShadow = true; m.receiveShadow = true;
    add(g, m, -(w + 0.4) / 2, top - 0.02, 0);
  }
  if (dome) { const m = new THREE.Mesh(new THREE.SphereGeometry(Math.min(w, d) * 0.36, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2), mat(dome, { roughness: 0.55 })); m.castShadow = true; add(g, m, 0, top + 0.2, 0); }
  if (tower) { const t = box(0.9, tower.h, 0.9, mat(tower.c ?? wall), 0.06); add(g, t, -w / 2 + 0.6, top + tower.h / 2, -d / 2 + 0.6); const cap = new THREE.Mesh(new THREE.ConeGeometry(0.75, 0.55, 4), mat(roof)); cap.rotation.y = Math.PI / 4; cap.castShadow = true; add(g, cap, -w / 2 + 0.6, top + tower.h + 0.25, -d / 2 + 0.6); }
  if (sign) { const sg = box(w * 0.6, 0.42, 0.1, mat(sign), 0.04); add(g, sg, 0, top - 0.35, d / 2 + 0.06); }
  if (o.storefront) { // big glass ground floor + striped awning row
    const gl = box(w - 0.3, fh * 0.78, 0.1, glassMat(0xa6e8ff), 0.03); add(g, gl, 0, 0.18 + fh * 0.5, d / 2 + 0.05);
    const n = Math.max(2, Math.round(w / 1.1));
    for (let i = 0; i < n; i++) { const x = -w / 2 + (i + 0.5) * (w / n); const a = box(w / n - 0.08, 0.07, 0.7, mat(i % 2 ? 0xffffff : o.storefront), 0.02); a.rotation.x = 0.28; add(g, a, x, 0.18 + fh * 0.98, d / 2 + 0.36); }
  }
  if (o.columns) { const n = Math.max(2, Math.round(w / 1.2)); for (let i = 0; i < n; i++) { const x = -w / 2 + (i + 0.5) * (w / n); const c = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, H, 12), mat(0xfff8e8)); c.castShadow = true; add(g, c, x, 0.18 + H / 2, d / 2 + 0.55); } const ped = box(w + 0.4, 0.22, 1.2, mat(0xfff8e8), 0.04); add(g, ped, 0, 0.18 + H + 0.05, d / 2 + 0.3); }
  if (o.chimney) { const c = box(0.42, 1.1, 0.42, mat(0xc98b6b), 0.04); add(g, c, w / 2 - 0.6, top + 0.55, -d / 2 + 0.7); }
  if (o.tank) { const t = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.7, 14), mat(0xd9d2c4)); t.castShadow = true; add(g, t, w / 2 - 0.7, top + 0.75, d / 2 - 0.7); for (const [dx, dz] of [[-0.3,-0.3],[0.3,-0.3],[-0.3,0.3],[0.3,0.3]]) { const l = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.5,6), mat(0x8a8378)); add(g, l, w/2-0.7+dx, top+0.28, d/2-0.7+dz); } }
  if (o.garden) { const gr = box(w - 0.9, 0.16, d - 0.9, mat(0x8fd06e), 0.05); add(g, gr, 0, top + 0.3, 0); for (const [dx, dz] of [[-0.5,-0.4],[0.6,0.3],[0.1,-0.7]]) { const b = bush(0x7cc93f); b.scale.setScalar(0.6); add(g, b, dx, top + 0.4, dz); } }
  if (o.clock) { const t = box(1.3, o.clock, 1.3, mat(0xfff8e8), 0.06); add(g, t, 0, top + o.clock / 2, 0); const face = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.08, 24), mat(0xffffff)); face.rotation.x = Math.PI / 2; add(g, face, 0, top + o.clock - 0.6, 0.68); const h1 = box(0.06, 0.3, 0.03, mat(0x1f3a5f), 0.01); add(g, h1, 0, top + o.clock - 0.48, 0.74); const cap = new THREE.Mesh(new THREE.ConeGeometry(1.05, 0.9, 4), mat(roof)); cap.rotation.y = Math.PI / 4; cap.castShadow = true; add(g, cap, 0, top + o.clock + 0.42, 0); const ball = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 10), mat(0xffd447, { emissive: 0x8a6a00, emissiveIntensity: 0.4 })); add(g, ball, 0, top + o.clock + 0.95, 0); }
  return g;
}
function tree(size = 1, c = 0x7dc25a) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.09 * size, 0.13 * size, 0.7 * size, 7), mat(0x9a6a45)); trunk.castShadow = true; add(g, trunk, 0, 0.35 * size, 0);
  const geo = new THREE.IcosahedronGeometry(0.55 * size, 0);
  for (const [x, y, z, sc] of [[0, 1.05, 0, 1], [0.35, 0.8, 0.15, 0.72], [-0.3, 0.85, -0.2, 0.68]]) {
    const m = new THREE.Mesh(geo, mat(c, { roughness: 0.9, flatShading: true })); m.scale.setScalar(sc); m.castShadow = true; m.receiveShadow = true; add(g, m, x * size, y * size, z * size);
  }

}
function lamp(x, z) { const g = new THREE.Group(); const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 2.2, 8), mat(0x4a5560)); pole.castShadow = true; add(g, pole, 0, 1.1, 0); const head = box(0.5, 0.16, 0.26, mat(0x4a5560), 0.04); add(g, head, 0.18, 2.25, 0); const bulb = box(0.36, 0.08, 0.2, mat(0xfff1b8, { emissive: 0xffe08a, emissiveIntensity: 0.8 }), 0.02); add(g, bulb, 0.18, 2.16, 0); g.position.set(x, 0, z); scene.add(g); }
function bench(x, z, rot = 0) { const g = new THREE.Group(); add(g, box(1.2, 0.08, 0.4, mat(0xb9855a), 0.02), 0, 0.42, 0); add(g, box(1.2, 0.34, 0.08, mat(0xb9855a), 0.02), 0, 0.62, -0.18); for (const dx of [-0.45, 0.45]) add(g, box(0.08, 0.4, 0.36, mat(0x4a5560), 0.02), dx, 0.2, 0); g.rotation.y = rot; g.position.set(x, 0, z); scene.add(g); }
function bus(x, z, rot = 0) { const g = new THREE.Group(); add(g, box(3.4, 1.15, 1.2, mat(0xffc93c, { roughness: 0.45 }), 0.12), 0, 0.85, 0); for (let i = 0; i < 4; i++) { add(g, box(0.62, 0.5, 0.06, glassMat(0x9fe0ff), 0.03), -1.2 + i * 0.8, 1.05, 0.62); add(g, box(0.62, 0.5, 0.06, glassMat(0x9fe0ff), 0.03), -1.2 + i * 0.8, 1.05, -0.62); } add(g, box(0.08, 0.5, 1.0, glassMat(0x9fe0ff), 0.03), 1.72, 1.05, 0); for (const [dx, dz] of [[-1.1, 0.6], [1.1, 0.6], [-1.1, -0.6], [1.1, -0.6]]) { const wh = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.2, 14), mat(0x2b2b3a)); wh.rotation.x = Math.PI / 2; wh.castShadow = true; add(g, wh, dx, 0.28, dz); } g.rotation.y = rot; g.position.set(x, 0, z); scene.add(g); }
function forest(x0, z0, x1, z1, step = 1.35, seed = 1) { let k = seed; const rnd = () => { k = (k * 9301 + 49297) % 233280; return k / 233280; }; for (let x = x0; x <= x1; x += step) for (let z = z0; z <= z1; z += step) { const t = tree(0.8 + rnd() * 0.5, [0x9be04a, 0x7cc93f, 0x8fd748, 0x6fbf3a][Math.floor(rnd() * 4)]); t.position.set(x + (rnd() - 0.5) * 0.6, 0, z + (rnd() - 0.5) * 0.6); t.rotation.y = rnd() * 6.28; scene.add(t); } }
function bush(c = 0x89cc63) { const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.35, 0), mat(c, { flatShading: true })); m.castShadow = true; m.position.y = 0.3; return m; }
function road(x, z, w, d) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.06, d), mat(0x9aa1a8, { roughness: 1 })); m.receiveShadow = true; m.position.set(x, 0.03, z); scene.add(m);
  const curbW = 0.4; for (const dz of [-1, 1]) { if (w > d) { const c = new THREE.Mesh(new THREE.BoxGeometry(w, 0.1, curbW), mat(0xe8e2d2)); c.receiveShadow = true; c.position.set(x, 0.05, z + dz * (d / 2 + curbW / 2)); scene.add(c); } else { const c = new THREE.Mesh(new THREE.BoxGeometry(curbW, 0.1, d), mat(0xe8e2d2)); c.receiveShadow = true; c.position.set(x + dz * (w / 2 + curbW / 2), 0.05, z); scene.add(c); } }

function star(x, y, z, scale = 1) {
  const shape = new THREE.Shape(); const R = 0.55 * scale, r = 0.24 * scale;
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5; const rr = i % 2 ? r : R; const px = Math.cos(a) * rr, py = Math.sin(a) * rr; i ? shape.lineTo(px, py) : shape.moveTo(px, py); }
  shape.closePath();

  const m = new THREE.Mesh(geo, mat(0xffd447, { roughness: 0.4, emissive: 0x8a6a00, emissiveIntensity: 0.35 })); m.castShadow = true; m.rotation.y = Math.PI / 4; m.rotation.x = -0.35; m.position.set(x, y, z); scene.add(m);

}

// ---------- palettes per city ----------
const P = {
  vmath: { wall: [0xf6d365, 0x8fb8f0, 0xffb073, 0xa7dcf7], roof: [0x3f6fb5, 0xe76f51, 0x2a9d8f], glass: 0x7fd0f0 },
  viet: { wall: [0xffe0b8, 0xf7c9a0, 0xfff1d6], roof: [0xd94f3a, 0xc2432f, 0xb63d2b], glass: 0x9fd8ea },
  esl: { wall: [0xffffff, 0x2a9d8f, 0xf4a261], roof: [0xe76f51, 0x264653, 0x2a9d8f], glass: 0x8ee3ff },
  enl: { wall: [0xd9c8f5, 0xf6f0ff, 0xc9b8ef], roof: [0x6f5bb0, 0x8e7cc3], glass: 0xa9e5ff },
  emath: { wall: [0xff9b57, 0xc9d2dc, 0x5e6f83], roof: [0x3d4b5c, 0xe9954a], glass: 0x7fd0f0 },
  esci: { wall: [0xbfeef5, 0xffffff, 0xb283e0], roof: [0x2fa7b5, 0x8a5fd0], glass: 0xc6f3ff },
};

if (MODE === 'city') {
  const ground = new THREE.Mesh(new THREE.BoxGeometry(90, 0.5, 90), mat(0x86d65a, { roughness: 1 })); ground.receiveShadow = true; ground.position.y = -0.25; scene.add(ground);
  // sidewalk blocks under building lots
  const lots = [[-8, 6, 13, 6.4], [6.5, 6, 11, 6.4], [-8, -6.2, 13, 6.4], [6.5, -6.2, 11, 6.4], [-7, 17, 11, 5.2]];
  for (const [x, z, w, d] of lots) { const p = new THREE.Mesh(new THREE.BoxGeometry(w, 0.12, d), mat(0xf1ece0, { roughness: 1 })); p.receiveShadow = true; p.position.set(x, 0.06, z); scene.add(p); }
  // roads: two horizontals, one vertical
  road(0, 0, 44, 3.0); road(0, -13, 44, 3.0); road(0.3, 0, 3.0, 44); road(0, 12, 44, 3.0);
  // crossing stripes at center
  for (let i = -3; i <= 3; i++) { const st = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.02, 2.6), mat(0xfff6dd)); st.position.set(2.5, 0.075, i * 0.4); scene.add(st); const st2 = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.02, 0.5), mat(0xfff6dd)); st2.position.set(i * 0.4 + 0.3, 0.075, 2.5); scene.add(st2); }

  const c = P.vmath;
  const specs = [
    // block NW (x<0, z>0): landmark toà thị chính + shop
    { x: -10, z: 5.4, w: 5.4, d: 3.6, floors: 2, fh: 1.35, wall: 0xfff1d6, roof: 0x3f6fb5, roofType: 'flat', columns: true, clock: 2.6, band: false },
    { x: -3.6, z: 5.8, w: 3.4, d: 3.2, floors: 2, wall: 0xff9b57, roof: 0xd94f3a, roofType: 'hip', chimney: true, awning: 0xffffff },
    // block NE
    { x: 5.4, z: 5.4, w: 3.6, d: 3.2, floors: 3, wall: 0x8fb8f0, roof: 0x2a9d8f, roofType: 'flat', garden: true, ac: true },
    { x: 9.6, z: 5.8, w: 2.8, d: 2.8, floors: 5, wall: 0xf6d365, roof: 0xe76f51, roofType: 'flat', tank: true },
    // block SW (z<0)
    { x: -10.2, z: -6.4, w: 4.6, d: 3.4, floors: 1, fh: 1.6, wall: 0xffffff, roof: 0xe76f51, roofType: 'flat', storefront: 0xe76f51, sign: 0xffd447 },
    { x: -4.2, z: -6.2, w: 3.2, d: 3.0, floors: 3, wall: 0xa7dcf7, roof: 0x3f6fb5, roofType: 'hip', tower: { h: 2.0, c: 0xffe9a8 } },
    // block SE
    { x: 5.2, z: -6.4, w: 3.4, d: 3.2, floors: 2, wall: 0xffe0b8, roof: 0xd94f3a, roofType: 'gable', chimney: true },
    { x: 9.8, z: -6.0, w: 3.2, d: 3.0, floors: 4, wall: 0x2a9d8f, roof: 0xffd447, roofType: 'flat', ac: true, trim: 0xe8fff9 },

    { x: -1.4, z: -18.4, w: 3.0, d: 3.0, floors: 2, wall: 0xff9b57, roof: 0xe76f51, roofType: 'hip' },
    { x: 4.6, z: -18.6, w: 3.4, d: 3.0, floors: 6, wall: 0x8fb8f0, roof: 0x2a9d8f, roofType: 'flat', tank: true, ac: true },
    { x: 10.4, z: -18.2, w: 3.0, d: 2.8, floors: 2, wall: 0xffffff, roof: 0xd94f3a, roofType: 'gable', awning: 0x3f6fb5 },
