<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<style>
html,body{margin:0;overflow:hidden;font-family:"Segoe UI","Nunito",Arial,sans-serif}
canvas{display:block}
.title{position:absolute;left:48px;top:32px;font-size:48px;font-weight:900;color:#1f3b63;text-shadow:0 3px 0 #fff}
.sub{position:absolute;left:50px;top:98px;font-size:26px;font-weight:600;color:#35557f}
.lab{position:absolute;transform:translateX(-50%);text-align:center;background:#fff;border-radius:22px;padding:10px 22px;box-shadow:0 6px 0 rgba(31,59,99,.15);white-space:nowrap}
.lab b{display:block;font-size:30px;color:#1f3b63}
.lab span{font-size:22px;color:#4a6a92;font-weight:600}
</style></head><body>
<div class="title" id="t"></div><div class="sub" id="s"></div>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import * as L from './lib.js';

const q = new URLSearchParams(location.search);
const W = +q.get('w') || 2400, H = +q.get('h') || 1100;
const city = q.get('city') || 'vmath';
const C = L.CITY[city];
const { renderer, scene, camera } = L.createStage({ W, H, fov: 20, target: [0, 3.4, 0], dist: +(q.get('dist') || 92), yaw: 32, pitch: 20, background: null, shadowSpan: 40 });
scene.fog = null;
const isV = city === 'viet'; const WN = isV ? 'Chùa Một Cột' : 'Kim tự tháp';
document.getElementById('t').textContent = `${C.name} — kỳ quan ${WN} ghép từng mảnh`;
document.getElementById('s').textContent = 'Tuần học đủ 4/7 ngày thêm 1 mảnh · lỡ tuần không mất mảnh nào · mảnh chưa có hiện mờ để con thấy hình sắp xong';

const ground = L.box(80, 0.4, 24, L.mat(L.WORLD.grass, { roughness: 1 }), 0.1); ground.position.set(0, -0.2, 0); scene.add(ground);
const total = isV ? 6 : 8; const stages = isV ? [1, 3, 6] : [2, 5, 8];
const labels = stages.map((k) => [k === total ? 'Xong kỳ quan!' : `${k}/${total} mảnh`, k === total ? 'cả thành phố ăn mừng' : `${k} tuần học đủ`]);
const gap = 15;
const tops = [];
stages.forEach((k, i) => {
  const x = (i - 1) * gap;
  const pad = L.box(13, 0.14, 13, L.mat(L.WORLD.plaza, { roughness: 1 }), 0.4); pad.position.set(x, 0.07, 0); scene.add(pad);
  const w = isV ? L.onePillarPagoda(k) : L.pyramid(k); w.position.set(x, 0.14, 0); if (isV) w.scale.setScalar(1.2); scene.add(w);
  if (k === total) { const sp = L.sparkles(9, 5, 4); sp.position.set(x, 7, 0); scene.add(sp); for (const [dx, dz, c] of [[-5, 5, 0xff6f61], [-3.8, 5.6, 0x5e93d6], [4.8, 5, 0xffd447]]) { const p = L.person(c); p.position.set(x + dx, 0.14, dz); scene.add(p); } }
  for (const [dx, dz] of [[-5.6, -5.6], [5.6, -5.4]]) { const t = L.tree(1.4, L.WORLD.leaves[i % 4], i * 3 + dx); t.position.set(x + dx, 0.14, dz); scene.add(t); }
  tops.push(new THREE.Vector3(x, -1.2, 7));
});
L.faceCamera(scene, camera);
renderer.render(scene, camera);
tops.forEach((p, i) => {
  const v = p.clone().project(camera);
  const el = document.createElement('div'); el.className = 'lab';
  el.innerHTML = `<b>${labels[i][0]}</b><span>${labels[i][1]}</span>`;
  el.style.left = `${(v.x + 1) / 2 * W}px`; el.style.top = `${(1 - v.y) / 2 * H}px`;
  document.body.appendChild(el);
});
window.__stats = L.stats(renderer, scene);
window.__done = true;
</script></body></html>
