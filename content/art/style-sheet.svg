<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="1400" height="980" font-family="Nunito, 'Be Vietnam Pro', system-ui, sans-serif">
  <title>Bảng tham chiếu phong cách — Góc của con (Thành phố Robot, khu Xưởng Số)</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCEEFF"/>
      <stop offset="1" stop-color="#B9DCFF"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E93F2"/>
      <stop offset="1" stop-color="#2F80ED"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2E2C6"/>
      <stop offset="1" stop-color="#E3CFA8"/>
    </linearGradient>
    <clipPath id="scene-clip"><rect x="40" y="96" width="880" height="520" rx="28"/></clipPath>
    <clipPath id="card-clip"><rect x="960" y="96" width="400" height="520" rx="28"/></clipPath>

    <!-- một bánh răng, dùng lại ở nền và ở thư viện vật thể -->
    <g id="gear">
      <g fill="#A9BDD3">
        <rect x="-8" y="-46" width="16" height="18" rx="5"/>
        <rect x="-8" y="28" width="16" height="18" rx="5"/>
        <rect x="-46" y="-8" width="18" height="16" rx="5"/>
        <rect x="28" y="-8" width="18" height="16" rx="5"/>
        <rect x="-8" y="-46" width="16" height="18" rx="5" transform="rotate(45)"/>
        <rect x="-8" y="28" width="16" height="18" rx="5" transform="rotate(45)"/>
        <rect x="-46" y="-8" width="18" height="16" rx="5" transform="rotate(45)"/>
        <rect x="28" y="-8" width="18" height="16" rx="5" transform="rotate(45)"/>
      </g>
      <circle r="32" fill="#C9D6E6"/>
      <path d="M-32 0a32 32 0 0 1 32-32 32 32 0 0 1 22 9A28 28 0 0 0-32 0Z" fill="#DDE6F1"/>
      <circle r="12" fill="#8FA6BF"/>
      <circle r="7" fill="#6E8AA8"/>
    </g>

    <!-- mây: ba khối tròn + mảng sáng ở đỉnh -->
    <g id="cloud">
      <ellipse cx="0" cy="6" rx="58" ry="26" fill="#EAF4FF"/>
      <circle cx="-24" cy="-2" r="24" fill="#FFFFFF"/>
      <circle cx="6" cy="-12" r="30" fill="#FFFFFF"/>
      <circle cx="34" cy="0" r="22" fill="#FFFFFF"/>
      <ellipse cx="0" cy="22" rx="56" ry="12" fill="#D7E9FF"/>
    </g>

    <!-- ngôi sao thưởng -->
    <g id="star">
      <path d="M0-34 10.2-12.2 34-8.8 16.8 8.2 21 32 0 20.8-21 32-16.8 8.2-34-8.8-10.2-12.2Z" fill="#FFD447"/>
      <path d="M0-34 10.2-12.2 34-8.8 16.8 8.2 21 32 0 20.8Z" fill="#FFC21A"/>
      <circle cx="-9" cy="-9" r="5" fill="#FFF0B8"/>
    </g>
  </defs>

  <rect width="1400" height="980" fill="#FFF8EC"/>

  <!-- ══════════════ tiêu đề ══════════════ -->
  <text x="40" y="48" font-size="30" font-weight="800" fill="#2B2B3A">Bảng tham chiếu phong cách — Góc của con</text>
  <text x="40" y="76" font-size="17" fill="#6B6B7B">Thế giới “Thành phố Robot”, khu Xưởng Số (Toán) · mascot Rô-bốt và bạn Cú · vật thể trong bài · nút chính</text>

  <!-- ══════════════ 1. NỀN THẾ GIỚI (3 lớp) ══════════════ -->
  <g clip-path="url(#scene-clip)">
    <!-- lớp xa: trời -->
    <g id="layer-sky">
      <rect x="40" y="96" width="880" height="520" fill="url(#sky)"/>
      <g id="sun">
        <circle cx="876" cy="154" r="46" fill="#FFD447"/>
        <circle cx="864" cy="142" r="30" fill="#FFE896"/>
      </g>
      <g id="clouds" fill-opacity="0.96">
        <use href="#cloud" transform="translate(190 184) scale(1.1)"/>
        <use href="#cloud" transform="translate(470 148) scale(0.8)"/>
        <use href="#cloud" transform="translate(700 246) scale(0.65)"/>
      </g>
      <!-- đồi xa -->
      <path d="M40 452c120-56 186-8 274-38 96-33 150 24 246 4 84-18 160 22 360-26v224H40Z" fill="#BBD6F2"/>
      <path d="M40 492c142-40 228 6 322-16 104-24 176 28 268 10 74-14 140 10 290-18v148H40Z" fill="#A9C6E8"/>
    </g>

    <!-- lớp giữa: công trình của khu -->
    <g id="layer-mid">
      <!-- tháp nhỏ bên trái -->
      <g>
        <rect x="96" y="356" width="104" height="176" rx="16" fill="#8FB8E8"/>
        <rect x="96" y="356" width="34" height="176" rx="16" fill="#A7C8F0"/>
        <rect x="86" y="336" width="124" height="30" rx="14" fill="#6E9AD6"/>
        <rect x="118" y="392" width="28" height="28" rx="9" fill="#FFD447"/>
        <rect x="158" y="392" width="28" height="28" rx="9" fill="#DCEEFF"/>
        <rect x="118" y="440" width="28" height="28" rx="9" fill="#DCEEFF"/>
        <rect x="158" y="440" width="28" height="28" rx="9" fill="#FFD447"/>
      </g>

      <!-- nhà máy chính: Xưởng Số -->
      <g>
        <rect x="238" y="286" width="330" height="246" rx="26" fill="#6E9AD6"/>
        <rect x="238" y="286" width="96" height="246" rx="26" fill="#82AAE0"/>
        <path d="M238 312a26 26 0 0 1 26-26h278a26 26 0 0 1 26 26v18H238Z" fill="#4E79B8"/>
        <!-- cửa lớn -->
        <rect x="352" y="424" width="104" height="108" rx="18" fill="#4E79B8"/>
        <rect x="366" y="440" width="76" height="92" rx="12" fill="#DCEEFF"/>
        <!-- cửa sổ -->
        <rect x="268" y="358" width="46" height="46" rx="14" fill="#FFD447"/>
        <rect x="330" y="358" width="46" height="46" rx="14" fill="#DCEEFF"/>
        <rect x="392" y="358" width="46" height="46" rx="14" fill="#FFD447"/>
        <rect x="454" y="358" width="46" height="46" rx="14" fill="#DCEEFF"/>
        <rect x="268" y="424" width="46" height="46" rx="14" fill="#DCEEFF"/>
        <rect x="494" y="358" width="46" height="112" rx="16" fill="#FF8C42"/>
        <rect x="502" y="370" width="30" height="30" rx="10" fill="#FFB989"/>
        <!-- ống khói + khói -->
        <rect x="286" y="238" width="44" height="56" rx="12" fill="#A9BDD3"/>
        <rect x="278" y="228" width="60" height="22" rx="10" fill="#C9D6E6"/>
        <g id="smoke" fill="#FFFFFF" fill-opacity="0.85">
          <circle cx="308" cy="206" r="16"/>
          <circle cx="330" cy="176" r="21"/>
          <circle cx="306" cy="142" r="14"/>
        </g>
        <!-- bánh răng gắn tường -->
        <g id="gears">
          <use href="#gear" transform="translate(536 300) scale(0.78)"/>
          <use href="#gear" transform="translate(596 350) scale(0.5)"/>
        </g>
      </g>

      <!-- bệ phóng + tên lửa -->
      <g>
        <rect x="676" y="470" width="150" height="62" rx="18" fill="#C9D6E6"/>
        <rect x="676" y="470" width="150" height="18" rx="9" fill="#DDE6F1"/>
        <g transform="translate(752 400)">
          <path d="M0-92c26 26 38 58 38 92H-38c0-34 12-66 38-92Z" fill="#F3F7FC"/>
          <path d="M0-92c-26 26-38 58-38 92h38Z" fill="#FFFFFF"/>
          <path d="M-38 0c-22 8-34 28-34 52l34-14Z" fill="#FF8C42"/>
          <path d="M38 0c22 8 34 28 34 52l-34-14Z" fill="#E9762F"/>
          <circle cx="0" cy="-34" r="20" fill="#2F80ED"/>
          <circle cx="-6" cy="-40" r="9" fill="#8FC3FF"/>
          <rect x="-16" y="30" width="32" height="20" rx="8" fill="#C9D6E6"/>
        </g>
      </g>

      <!-- cột đèn -->
      <g>
        <rect x="858" y="366" width="12" height="170" rx="6" fill="#A9BDD3"/>
        <circle cx="864" cy="358" r="22" fill="#FFD447"/>
        <circle cx="858" cy="352" r="12" fill="#FFEFAE"/>
      </g>
    </g>

    <!-- lớp gần: mặt đất và vật sát khung -->
    <g id="layer-fore">
      <rect x="40" y="518" width="880" height="98" fill="url(#ground)"/>
      <path d="M40 518h880v14a1600 1600 0 0 1-880 0Z" fill="#F8EFDD"/>
      <g id="grass" fill="#7BC67E">
        <path d="M104 520c8 12 8 22 0 30-10-10-10-20 0-30Z"/>
        <path d="M126 522c10 10 12 20 4 28-12-8-14-18-4-28Z" fill="#5FA968"/>
        <path d="M690 520c8 12 8 22 0 30-10-10-10-20 0-30Z"/>
        <path d="M712 522c10 10 12 20 4 28-12-8-14-18-4-28Z" fill="#5FA968"/>
        <path d="M862 520c8 12 8 22 0 30-10-10-10-20 0-30Z"/>
      </g>
      <!-- bánh răng nằm trên đất + bu lông -->
      <ellipse cx="188" cy="586" rx="52" ry="12" fill="#C8A87A" fill-opacity="0.35"/>
      <use href="#gear" transform="translate(188 556) scale(0.62)"/>
      <g fill="#A9BDD3">
        <circle cx="836" cy="576" r="11"/>
        <circle cx="858" cy="588" r="8"/>
      </g>
      <g id="sparkles" fill="#FFFFFF" fill-opacity="0.9">
        <path d="M622 246c3 9 5 11 14 14-9 3-11 5-14 14-3-9-5-11-14-14 9-3 11-5 14-14Z"/>
        <path d="M162 300c2 6 4 8 10 10-6 2-8 4-10 10-2-6-4-8-10-10 6-2 8-4 10-10Z"/>
      </g>
    </g>

    <!-- ══════════════ 2. MASCOT RÔ-BỐT (trạng thái greet) ══════════════ -->
    <g id="mascot-robot" transform="translate(556 366) scale(1.08)">
      <ellipse id="shadow" cx="0" cy="162" rx="76" ry="17" fill="#B99A6C" fill-opacity="0.30"/>
      <!-- chân -->
      <g fill="#8FA6BF">
        <rect x="-42" y="104" width="30" height="52" rx="14"/>
        <rect x="12" y="104" width="30" height="52" rx="14"/>
      </g>
      <g fill="#6E8AA8">
        <rect x="-50" y="142" width="46" height="20" rx="10"/>
        <rect x="4" y="142" width="46" height="20" rx="10"/>
      </g>
      <!-- thân -->
      <g id="body">
        <rect x="-62" y="14" width="124" height="104" rx="34" fill="#C9D6E6"/>
        <rect x="-62" y="14" width="46" height="104" rx="34" fill="#DDE6F1"/>
        <rect x="-38" y="40" width="76" height="52" rx="18" fill="#2F80ED"/>
        <rect x="-30" y="48" width="60" height="16" rx="8" fill="#5FA3FF"/>
        <circle cx="-14" cy="78" r="7" fill="#FFD447"/>
        <circle cx="6" cy="78" r="7" fill="#FF8C42"/>
        <circle cx="26" cy="78" r="7" fill="#7BC67E"/>
      </g>
      <!-- tay phải -->
      <g id="arm-r">
        <rect x="62" y="28" width="28" height="72" rx="14" fill="#C9D6E6"/>
        <circle cx="76" cy="104" r="18" fill="#DDE6F1"/>
      </g>
      <!-- đầu -->
      <g id="head">
        <g id="antenna">
          <rect x="-5" y="-96" width="10" height="26" rx="5" fill="#A9BDD3"/>
          <circle cx="0" cy="-102" r="13" fill="#FF8C42"/>
          <circle cx="-4" cy="-106" r="5" fill="#FFC49A"/>
        </g>
        <rect x="-72" y="-72" width="144" height="96" rx="34" fill="#DDE6F1"/>
        <rect x="-72" y="-72" width="60" height="96" rx="34" fill="#EDF3F9"/>
        <rect x="-58" y="-58" width="116" height="66" rx="24" fill="#2B3A4A"/>
        <!-- mắt -->
        <g id="eye-l"><circle cx="-24" cy="-28" r="15" fill="#FFFFFF"/><circle cx="-21" cy="-26" r="7" fill="#2B3A4A"/><circle cx="-27" cy="-32" r="3.5" fill="#FFFFFF"/></g>
        <g id="eye-r"><circle cx="24" cy="-28" r="15" fill="#FFFFFF"/><circle cx="27" cy="-26" r="7" fill="#2B3A4A"/><circle cx="21" cy="-32" r="3.5" fill="#FFFFFF"/></g>
        <!-- miệng: khung "mở nhỏ" -->
        <path id="mouth" d="M-16-4a16 12 0 0 0 32 0Z" fill="#7FD3FF"/>
        <!-- tai -->
        <rect x="-84" y="-40" width="16" height="34" rx="8" fill="#A9BDD3"/>
        <rect x="68" y="-40" width="16" height="34" rx="8" fill="#A9BDD3"/>
      </g>
      <!-- tay trái giơ lên vẫy (greet) — vẽ sau cùng để bàn tay nằm trước đầu -->
      <g id="arm-l" transform="translate(-66 26) rotate(152)">
        <rect x="-14" y="-10" width="28" height="92" rx="14" fill="#C9D6E6"/>
        <circle cx="0" cy="88" r="19" fill="#E6EDF5"/>
      </g>
    </g>

    <!-- bong bóng lời chào -->
    <g transform="translate(712 232)">
      <rect x="-86" y="-40" width="172" height="76" rx="26" fill="#FFFFFF" fill-opacity="0.96"/>
      <path d="M-34 34 -52 62 -8 36Z" fill="#FFFFFF" fill-opacity="0.96"/>
      <text x="0" y="-4" text-anchor="middle" font-size="23" font-weight="800" fill="#2B2B3A">Chào Thanh!</text>
      <text x="0" y="24" text-anchor="middle" font-size="17" fill="#6B6B7B">Mình đi làm nhiệm vụ nhé</text>
    </g>
  </g>
  <rect x="40" y="96" width="880" height="520" rx="28" fill="none" stroke="#E6D9C0" stroke-width="3"/>
  <text x="40" y="646" font-size="15" fill="#6B6B7B">① Nền thế giới 3 lớp (trời · công trình · mặt đất) + mascot Rô-bốt trạng thái <tspan font-weight="700">greet</tspan>. Vùng giữa để trống cho đề bài.</text>

  <!-- ══════════════ 3. THẺ MASCOT CÚ + BẢNG MÀU ══════════════ -->
  <g clip-path="url(#card-clip)">
    <rect x="960" y="96" width="400" height="520" fill="#FFF3DF"/>
    <circle cx="1160" cy="300" r="150" fill="#FFE9C4"/>

    <!-- mascot Cú (trạng thái idle) -->
    <g id="mascot-owl" transform="translate(1160 306)">
      <ellipse cx="0" cy="128" rx="70" ry="16" fill="#C8A87A" fill-opacity="0.30"/>
      <!-- chân -->
      <g fill="#FF8C42">
        <rect x="-26" y="96" width="14" height="26" rx="7"/>
        <rect x="12" y="96" width="14" height="26" rx="7"/>
        <rect x="-40" y="116" width="42" height="12" rx="6"/>
        <rect x="-2" y="116" width="42" height="12" rx="6"/>
      </g>
      <!-- thân -->
      <g id="owl-body">
        <ellipse cx="0" cy="26" rx="84" ry="90" fill="#A87BD6"/>
        <ellipse cx="-26" cy="12" rx="54" ry="72" fill="#B98FE0"/>
        <ellipse cx="0" cy="48" rx="54" ry="60" fill="#F4E6FF"/>
      </g>
      <!-- cánh -->
      <path id="wing-l" d="M-78 6c-18 26-16 62 6 84 14-18 18-54 12-84Z" fill="#8E63BE"/>
      <path id="wing-r" d="M78 6c18 26 16 62-6 84-14-18-18-54-12-84Z" fill="#8E63BE"/>
      <!-- chỏm lông -->
      <path d="M-58-58c-8-22-2-40 14-48 6 16 4 34-14 48Z" fill="#8E63BE"/>
      <path d="M58-58c8-22 2-40-14-48-6 16-4 34 14 48Z" fill="#8E63BE"/>
      <!-- mắt -->
      <g id="owl-eyes">
        <circle cx="-32" cy="-18" r="34" fill="#FFFFFF"/>
        <circle cx="32" cy="-18" r="34" fill="#FFFFFF"/>
        <circle cx="-28" cy="-14" r="16" fill="#2B3A4A"/>
        <circle cx="28" cy="-14" r="16" fill="#2B3A4A"/>
        <circle cx="-34" cy="-22" r="6" fill="#FFFFFF"/>
        <circle cx="22" cy="-22" r="6" fill="#FFFFFF"/>
      </g>
      <!-- mỏ -->
      <path d="M0 6 -16-10h32Z" fill="#FF8C42"/>
      <path d="M0 6 -16-10h16Z" fill="#FFA766"/>
    </g>
    <text x="1160" y="452" text-anchor="middle" font-size="20" font-weight="800" fill="#2B2B3A">bạn Cú — trạng thái idle</text>
    <text x="1160" y="478" text-anchor="middle" font-size="15" fill="#6B6B7B">chớp mắt 3–6 s · chạm vào thì nghiêng đầu</text>

    <!-- bảng màu -->
    <g transform="translate(986 506)">
      <g font-size="13" fill="#6B6B7B">
        <g>
          <rect width="52" height="52" rx="16" fill="#2F80ED"/><text x="26" y="70" text-anchor="middle">primary</text>
        </g>
        <g transform="translate(70 0)">
          <rect width="52" height="52" rx="16" fill="#FF8C42"/><text x="26" y="70" text-anchor="middle">accent</text>
        </g>
        <g transform="translate(140 0)">
          <rect width="52" height="52" rx="16" fill="#FFD447"/><text x="26" y="70" text-anchor="middle">thưởng</text>
        </g>
        <g transform="translate(210 0)">
          <rect width="52" height="52" rx="16" fill="#34C759"/><text x="26" y="70" text-anchor="middle">đúng</text>
        </g>
        <g transform="translate(280 0)">
          <rect width="52" height="52" rx="16" fill="#FFB020"/><text x="26" y="70" text-anchor="middle">gần đúng</text>
        </g>
      </g>
    </g>
  </g>
  <rect x="960" y="96" width="400" height="520" rx="28" fill="none" stroke="#E6D9C0" stroke-width="3"/>
  <text x="960" y="646" font-size="15" fill="#6B6B7B">② Mascot thứ hai + bảng màu. Không có màu đỏ báo lỗi.</text>

  <!-- ══════════════ 4. VẬT THỂ TRONG BÀI ══════════════ -->
  <g transform="translate(40 690)">
    <g>
      <rect width="180" height="180" rx="28" fill="#FFFFFF"/>
      <rect width="180" height="180" rx="28" fill="none" stroke="#EFE3CC" stroke-width="3"/>
      <ellipse cx="90" cy="140" rx="46" ry="10" fill="#C8A87A" fill-opacity="0.28"/>
      <use href="#gear" transform="translate(90 84) scale(1.15)"/>
      <text x="90" y="168" text-anchor="middle" font-size="15" fill="#6B6B7B">bánh răng · gear</text>
    </g>
    <g transform="translate(200 0)">
      <rect width="180" height="180" rx="28" fill="#FFFFFF"/>
      <rect width="180" height="180" rx="28" fill="none" stroke="#EFE3CC" stroke-width="3"/>
      <ellipse cx="90" cy="140" rx="40" ry="10" fill="#C8A87A" fill-opacity="0.28"/>
      <g transform="translate(90 108) scale(0.72)">
        <path d="M0-92c26 26 38 58 38 92H-38c0-34 12-66 38-92Z" fill="#DDE6F1"/>
        <path d="M0-92c-26 26-38 58-38 92h38Z" fill="#F7FAFD"/>
        <path d="M-38 0c-22 8-34 28-34 52l34-14Z" fill="#FF8C42"/>
        <path d="M38 0c22 8 34 28 34 52l-34-14Z" fill="#E9762F"/>
        <circle cx="0" cy="-34" r="20" fill="#2F80ED"/>
        <circle cx="-6" cy="-40" r="9" fill="#8FC3FF"/>
      </g>
      <text x="90" y="168" text-anchor="middle" font-size="15" fill="#6B6B7B">tên lửa · rocket</text>
    </g>
    <g transform="translate(400 0)">
      <rect width="180" height="180" rx="28" fill="#FFFFFF"/>
      <rect width="180" height="180" rx="28" fill="none" stroke="#EFE3CC" stroke-width="3"/>
      <ellipse cx="90" cy="140" rx="40" ry="10" fill="#C8A87A" fill-opacity="0.28"/>
      <g transform="translate(90 82)">
        <path d="M0-44c10-12 30-14 40-4-14 4-22 12-26 22 18-8 38 2 42 20 5 22-10 46-30 50-10 2-18-3-26-3s-16 5-26 3c-20-4-35-28-30-50 4-18 24-28 42-20-4-10-12-18-26-22 10-10 30-8 40 4Z" fill="#E8604C"/>
        <path d="M-14-18c-16-2-30 8-33 24-3 15 5 33 17 41-8-12-11-27-7-40 4-13 13-22 23-25Z" fill="#F4806E"/>
        <path d="M0-44c6-14 18-22 30-22-2 14-12 24-26 28Z" fill="#7BC67E"/>
      </g>
      <text x="90" y="168" text-anchor="middle" font-size="15" fill="#6B6B7B">quả táo · apple</text>
    </g>
    <text x="0" y="212" font-size="15" fill="#6B6B7B">③ Vật thể dùng trong bài (đọc được ở 64 px, luôn có một bóng elip mềm, không viền đen).</text>
  </g>

  <!-- ══════════════ 5. NÚT CHÍNH + SAO ══════════════ -->
  <g transform="translate(660 690)">
    <rect x="0" y="12" width="420" height="96" rx="34" fill="#1F5FBF" fill-opacity="0.35"/>
    <rect width="420" height="96" rx="34" fill="url(#btn)"/>
    <rect x="14" y="12" width="392" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.18"/>
    <g transform="translate(66 48)">
      <circle r="26" fill="#FFFFFF" fill-opacity="0.22"/>
      <use href="#star" transform="scale(0.62)"/>
    </g>
    <text x="230" y="60" text-anchor="middle" font-size="30" font-weight="800" fill="#FFFFFF">Nhiệm vụ hôm nay</text>
    <text x="0" y="146" font-size="15" fill="#6B6B7B">④ Nút chính: cao 96 px, chữ 30 px, bo 34 px, mảng sáng ở đỉnh, bóng mềm dưới đáy.</text>
