# docker compose -f docker/compose.yml up -d --build
# Three services only (docs/02 §7, docs/08 pha 0): postgres, web, worker.
# All containers read ../.env (copy .env.example → .env at the repo root).
# Inside the containers DATABASE_URL is rebuilt from POSTGRES_* to point at the "postgres" service,
# so the DATABASE_URL in .env only matters for tools run on the host (pnpm dev, prisma studio).
# The host port for Postgres defaults to 5432; to change it run with `--env-file .env` and set POSTGRES_PORT.

name: mtct

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: 3000 # container port; the host port comes from .env PORT (${PORT}:3000)
      DATABASE_HOST: postgres
      FILE_ROOT: /data/files
      INBOX_ROOT: /data/inbox
      # The backup folder lives on the host; mounted read-only so /admin/health can say how old the
      # last backup is, and so the disk figure is the drive the owner would actually clear. Without
      # this the card is permanently red in Docker and the free space shown is the Docker VM's.
      BACKUP_DIR: /backup-out
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - files:/data/files
      - inbox:/data/inbox
      - ${BACKUP_DIR:-../_sao-luu}:/backup-out:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      FILE_ROOT: /data/files
      INBOX_ROOT: /data/inbox
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - files:/data/files
      - inbox:/data/inbox
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started

  # ── Mở ra internet (docs/08 pha 8 việc 1) ─────────────────────────────────────────────────
  # Outbound only: the tunnel dials Cloudflare, so no port is opened on the house router and the
  # machine's other services (ports 80 and 443 belong to something else here) are untouched.
  # Start it with the profile so a LAN-only run never needs a token:
  #   docker compose --env-file .env -f docker/compose.yml --profile tunnel up -d cloudflared
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Empty by default: compose interpolates every service in the file, so a mandatory `:?` here
      # would break `--profile backup` too. cloudflared refuses to start without it and says so.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      web:
        condition: service_started

  # ── Sao lưu hằng đêm (docs/08 pha 8 việc 2) ───────────────────────────────────────────────
  # pg_dump + a copy of the files, written to BACKUP_DIR on the host so the folder is visible in
  # Explorer and can be synced to a NAS by whatever the family already uses.
  #   docker compose --env-file .env -f docker/compose.yml --profile backup up -d backup
  backup:
    image: postgres:16
    profiles: ["backup"]
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      TZ: Asia/Ho_Chi_Minh
      PGHOST: postgres
      BACKUP_HOUR: ${BACKUP_HOUR:-1}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    entrypoint: ["/bin/sh", "/backup/backup-loop.sh"]
    volumes:
      - ./backup:/backup:ro
      - files:/data/files:ro
      - ${BACKUP_DIR:-../_sao-luu}:/out
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  files:
  inbox:
